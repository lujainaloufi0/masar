name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://masar:masar@localhost:5432/masar
  TEST_DATABASE_URL: postgresql://masar:masar@localhost:5432/masar_test
  JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
  DEMO_MODE: 'true'
  WEB_ORIGIN: http://localhost:3000
  TZ: Asia/Riyadh

jobs:
  check:
    name: Types and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: masar, POSTGRES_PASSWORD: masar, POSTGRES_DB: masar_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @masar/shared build
      - run: pnpm --filter @masar/api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm --filter @masar/shared test
      - run: pnpm --filter @masar/web test
      - name: API integration tests
        run: |
          DATABASE_URL=$TEST_DATABASE_URL pnpm --filter @masar/api exec prisma migrate deploy
          pnpm --filter @masar/api test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: masar, POSTGRES_PASSWORD: masar, POSTGRES_DB: masar }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @masar/api exec prisma migrate deploy && pnpm db:seed
      - name: Start API and web
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && API_INTERNAL_URL=http://localhost:4000 pnpm start > ../../web.log 2>&1 &)
          npx wait-on -t 60000 http://localhost:4000/api/health http://localhost:3000/login
      - run: pnpm --filter @masar/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        run: tail -n 100 api.log web.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, push: false, tags: masar-api:ci, cache-from: type=gha, cache-to: 'type=gha,mode=max' }
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: false, tags: masar-web:ci, cache-from: type=gha, cache-to: 'type=gha,mode=max' }
