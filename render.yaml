# Render Blueprint: New → Blueprint → pick this repository.
# Creates the database, the API and the web app. Open the web service's URL when it's live.
databases:
  - name: masar-db
    databaseName: masar
    user: masar
    plan: free

services:
  - type: web
    name: masar-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: masar-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: 'true'
      - key: DEMO_RESET_CRON
        value: '0 3 * * *'
      - key: TZ
        value: Asia/Riyadh
      - key: API_PORT
        value: '4000'
      - key: PORT
        value: '4000'

  - type: web
    name: masar-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # The API's public address, e.g. https://masar-api-xxxx.onrender.com
      # (free services can't receive private-network traffic, so the internal address won't work).
      # Render asks for this value when the Blueprint is created.
      - key: API_INTERNAL_URL
        sync: false
